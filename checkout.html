<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beena Trading Company - Checkout</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#222;
}

header{
  background:#2874f0;
  color:white;
  padding:18px 5%;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:30px auto;
  padding:20px;
}

.box{
  background:white;
  padding:25px;
  margin-bottom:20px;
  border-radius:8px;
  box-shadow:0 2px 8px #ddd;
}

h1{
  margin-bottom:20px;
}

h2{
  margin-bottom:15px;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:5px;
  font-weight:bold;
}

input, textarea, select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:5px;
  font-size:16px;
}

textarea{
  height:90px;
}

.order{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #ddd;
}

.total{
  text-align:right;
  font-size:22px;
  font-weight:bold;
  margin-top:20px;
}

button{
  background:#2874f0;
  color:white;
  border:0;
  padding:14px 25px;
  font-size:17px;
  border-radius:5px;
  cursor:pointer;
  margin-top:20px;
}

button:hover{
  background:#125dcc;
}

.back{
  background:#555;
  margin-right:10px;
}

footer{
  background:#172337;
  color:white;
  text-align:center;
  padding:25px;
  margin-top:30px;
}

@media(max-width:600px){
  .container{
    margin:10px;
    padding:10px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">BEENA TRADING COMPANY</div>
</header>

<div class="container">

<h1>Checkout</h1>

<div class="box">
<h2>Delivery Address</h2>

<label>Full Name</label>
<input type="text" id="name" placeholder="Enter your full name">

<label>Mobile Number</label>
<input type="tel" id="mobile" placeholder="Enter mobile number">

<label>Address</label>
<textarea id="address" placeholder="House No, Street, Area"></textarea>

<label>City</label>
<input type="text" id="city" placeholder="Enter city">

<label>State</label>
<input type="text" id="state" placeholder="Enter state">

<label>PIN Code</label>
<input type="text" id="pin" placeholder="Enter PIN code">
</div>

<div class="box">
<h2>Payment Method</h2>

<select id="payment">
  <option value="">Select Payment Method</option>
  <option>Cash on Delivery</option>
  <option>UPI</option>
  <option>Debit / Credit Card</option>
</select>
</div>

<div class="box">
<h2>Order Summary</h2>

<div class="order">
  <span>Product</span>
  <strong>Smartphone</strong>
</div>

<div class="order">
  <span>Price</span>
  <strong>₹14,999</strong>
</div>

<div class="total">
Total: ₹14,999
</div>

<button class="back" onclick="goBack()">Back</button>
<button onclick="placeOrder()">Place Order</button>

</div>

</div>

<footer>
© 2026 Beena Trading Company<br>
India's New Online Marketplace
</footer>

<script>

function goBack(){
  window.location.href="index.html";
}
function placeOrder(){

    let name = document.getElementById("name").value.trim();
    let mobile = document.getElementById("mobile").value.trim();
    let address = document.getElementById("address").value.trim();
    let city = document.getElementById("city").value.trim();
    let state = document.getElementById("state").value.trim();
    let pin = document.getElementById("pin").value.trim();
    let payment = document.getElementById("payment").value;

    if(name === "" || mobile === "" || address === "" ||
       city === "" || state === "" || pin === ""){

        alert("Please fill all customer details.");
        return;
    }

    let orders = JSON.parse(localStorage.getItem("btc_orders") || "[]");

    let order = {
        id: "BTC" + Date.now(),
        name: name,
        mobile: mobile,
        address: address,
        city: city,
        state: state,
        pin: pin,
        payment: payment,
        total: 14999,
        date: new Date().toLocaleString("en-IN")
    };

    orders.push(order);

    localStorage.setItem("btc_orders", JSON.stringify(orders));

    alert(
        "Order placed successfully!\n\n" +
        "Thank you, BEENA!\n" +
        "Your order will be processed soon."
    );

    window.location.href = "index.html";
}
window.goBack = goBack;
window.placeOrder = placeOrder

</script>
</html>
