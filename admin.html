<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beena Trading Company - Admin</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}
header{
    background:#0879d1;
    color:white;
    padding:22px 5%;
    font-size:26px;
    font-weight:bold;
}
.container{
    width:92%;
    max-width:1200px;
    margin:25px auto;
}
.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}
.card{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 2px 8px #ccc;
}
.card h3{margin:0 0 12px}
.number{
    color:#0879d1;
    font-size:30px;
    font-weight:bold;
}
.panel{
    background:white;
    margin-top:22px;
    padding:25px;
    border-radius:10px;
    box-shadow:0 2px 8px #ccc;
}
input,select{
    width:100%;
    padding:12px;
    margin:7px 0 15px;
    border:1px solid #ccc;
    border-radius:5px;
}
button{
    border:0;
    padding:10px 16px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}
.add{
    background:#0879d1;
    color:white;
}
.delete{
    background:#e53935;
    color:white;
}
.edit{
    background:#f2a900;
    color:white;
    margin-right:5px;
}
.products{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}
.product{
    border:1px solid #ddd;
    padding:15px;
    border-radius:8px;
}
.product img{
    width:100%;
    height:130px;
    object-fit:contain;
    background:#eee;
}
.order{
    border:1px solid #ddd;
    padding:18px;
    margin-top:15px;
    border-radius:8px;
}
.status{
    display:inline-block;
    background:#18a558;
    color:white;
    padding:6px 10px;
    border-radius:15px;
}
@media(max-width:700px){
    .cards,.products{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>BEENA TRADING COMPANY</header>

<div class="container">

<div class="cards">
<div class="card">
<h3>Total Orders</h3>
<div class="number" id="totalOrders">0</div>
</div>

<div class="card">
<h3>Total Sales</h3>
<div class="number" id="totalSales">₹0</div>
</div>

<div class="card">
<h3>Products</h3>
<div class="number" id="totalProducts">0</div>
</div>
</div>

<div class="panel">
<h2>➕ Add New Product</h2>

<label>Product Name</label>
<input id="productName" placeholder="Enter product name">

<label>Category</label>
<select id="productCategory">
<option>Electronics</option>
<option>Fashion</option>
<option>Home</option>
<option>Beauty</option>
<option>Grocery</option>
<option>Accessories</option>
</select>

<label>Price</label>
<input id="productPrice" type="number" placeholder="Enter price">

<label>Stock</label>
<input id="productStock" type="number" placeholder="Enter stock">

<label>Image / Emoji</label>
<input id="productImage" placeholder="Example: 📱">

<button class="add" onclick="addProduct()">Add Product</button>
</div>

<div class="panel">
<h2>📦 Product Management</h2>
<div class="products" id="productList"></div>
</div>

<div class="panel">
<h2>🛒 Order Management</h2>

<button class="delete" onclick="clearOrders()">Clear All Orders</button>

<div id="orderList"></div>
</div>

</div>

<script>

let products = JSON.parse(localStorage.getItem("btc_products")) || [
{
name:"Smartphone",
category:"Electronics",
price:14999,
stock:20,
image:"📱"
},
{
name:"Running Shoes",
category:"Fashion",
price:1999,
stock:30,
image:"👟"
},
{
name:"Wireless Headphones",
category:"Accessories",
price:1499,
stock:25,
image:"🎧"
},
{
name:"Smart Watch",
category:"Electronics",
price:2499,
stock:15,
image:"⌚"
}
];

function saveProducts(){
    localStorage.setItem("btc_products",JSON.stringify(products));
}

function addProduct(){

    let name=document.getElementById("productName").value.trim();
    let category=document.getElementById("productCategory").value;
    let price=Number(document.getElementById("productPrice").value);
    let stock=Number(document.getElementById("productStock").value);
    let image=document.getElementById("productImage").value.trim();

    if(!name || !price){
        alert("Please enter product name and price.");
        return;
    }

    products.push({
        name:name,
        category:category,
        price:price,
        stock:stock,
        image:image || "📦"
    });

    saveProducts();

    document.getElementById("productName").value="";
    document.getElementById("productPrice").value="";
    document.getElementById("productStock").value="";
    document.getElementById("productImage").value="";

    renderProducts();
    updateDashboard();

    alert("Product added successfully!");
}

function deleteProduct(index){

    if(confirm("Are you sure you want to delete this product?")){
        products.splice(index,1);
        saveProducts();
        renderProducts();
        updateDashboard();
    }
}

function editProduct(index){

    let p=products[index];

    let name=prompt("Product name:",p.name);
    if(name===null)return;

    let price=prompt("Price:",p.price);
    if(price===null)return;

    let stock=prompt("Stock:",p.stock);
    if(stock===null)return;

    p.name=name;
    p.price=Number(price);
    p.stock=Number(stock);

    saveProducts();
    renderProducts();
    updateDashboard();
}

function renderProducts(){

    let box=document.getElementById("productList");

    if(products.length===0){
        box.innerHTML="<p>No products available.</p>";
        return;
    }

    box.innerHTML=products.map(function(p,index){

        return `
        <div class="product">

            <div style="font-size:60px;text-align:center;background:#eee;padding:20px">
                ${p.image}
            </div>

            <h3>${p.name}</h3>

            <p>Category: ${p.category}</p>

            <p><b>₹${Number(p.price).toLocaleString("en-IN")}</b></p>

            <p>Stock: ${p.stock}</p>

            <button class="edit" onclick="editProduct(${index})">
                Edit
            </button>

            <button class="delete" onclick="deleteProduct(${index})">
                Delete
            </button>

        </div>
        `;

    }).join("");
}

function getOrders(){

    return JSON.parse(localStorage.getItem("btc_orders")) || [];

}

function renderOrders(){

    let orders=getOrders();

    let box=document.getElementById("orderList");

    if(orders.length===0){
        box.innerHTML="<p style='text-align:center'>No orders yet.</p>";
        return;
    }

    box.innerHTML=orders.map(function(o){

        return `
        <div class="order">

            <h3>Order ID: ${o.id || "N/A"}</h3>

            <p><b>Customer:</b> ${o.name || "N/A"}</p>

            <p><b>Mobile:</b> ${o.mobile || "N/A"}</p>

            <p><b>Address:</b> ${o.address || "N/A"}</p>

            <p><b>City:</b> ${o.city || "N/A"}</p>

            <p><b>State:</b> ${o.state || "N/A"}</p>

            <p><b>PIN:</b> ${o.pin || "N/A"}</p>

            <p><b>Payment:</b> ${o.payment || "N/A"}</p>

            <p><b>Total:</b> ₹${Number(o.total || 0).toLocaleString("en-IN")}</p>

            <p><b>Date:</b> ${o.date || "N/A"}</p>

<select onchange="updateOrderStatus('${o.id}', this.value)">
  <option value="Order Placed" ${o.status === "Order Placed" ? "selected" : ""}>Order Placed</option>
  <option value="Confirmed" ${o.status === "Confirmed" ? "selected" : ""}>Confirmed</option>
  <option value="Shipped" ${o.status === "Shipped" ? "selected" : ""}>Shipped</option>
  <option value="Delivered" ${o.status === "Delivered" ? "selected" : ""}>Delivered</option>
  <option value="Cancelled" ${o.status === "Cancelled" ? "selected" : ""}>Cancelled</option>
</select>

        </div>
        `;

    }).join("");
}
function updateOrderStatus(orderId, status){
  let orders = getOrders();

  orders = orders.map(function(o){
    if(String(o.id) === String(orderId)){
      o.status = status;
    }
    return o;
  });

  localStorage.setItem("btc_orders", JSON.stringify(orders));

  renderOrders();
  updateDashboard();
}
function clearOrders(){

    if(confirm("Are you sure you want to delete all orders?")){

        localStorage.removeItem("btc_orders");

        renderOrders();
        updateDashboard();

        alert("All orders deleted.");
    }
}

function updateDashboard(){

    let orders=getOrders();

    document.getElementById("totalOrders").textContent=orders.length;

    let sales=orders.reduce(function(total,o){
        return total + Number(o.total || 0);
    },0);

    document.getElementById("totalSales").textContent=
        "₹"+sales.toLocaleString("en-IN");

    document.getElementById("totalProducts").textContent=
        products.length;
}

renderProducts();
renderOrders();
updateDashboard();

</script>

</body>
</html>
