<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beena Trading Company</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#0878d1;
  color:white;
  padding:14px 4%;
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.search{
  flex:1;
  min-width:250px;
}

.search input{
  width:100%;
  padding:12px;
  border:0;
  border-radius:5px;
  font-size:15px;
}

.header-buttons{
  display:flex;
  gap:8px;
}

.header-buttons button{
  border:0;
  padding:10px 14px;
  border-radius:5px;
  cursor:pointer;
}

.cart-btn{
  background:#ffca05;
}

.admin-btn{
  background:white;
  color:#0878d1;
}

nav{
  background:white;
  padding:12px 4%;
  display:flex;
  gap:25px;
  box-shadow:0 2px 5px #ddd;
  flex-wrap:wrap;
}

nav button{
  background:none;
  border:0;
  cursor:pointer;
  font-size:15px;
}

.container{
  width:92%;
  max-width:1300px;
  margin:25px auto;
}

.hero{
  background:#0878d1;
  color:white;
  padding:35px;
  border-radius:10px;
  margin-bottom:25px;
}

.hero h1{
  margin-top:0;
  font-size:32px;
}

.shop-btn{
  background:#ffca05;
  border:0;
  padding:12px 22px;
  font-weight:bold;
  cursor:pointer;
  border-radius:5px;
}

h2{
  margin-top:25px;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.product{
  background:white;
  padding:15px;
  border-radius:10px;
  box-shadow:0 2px 8px #ddd;
}

.product-image{
  height:170px;
  background:#eee;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:65px;
  border-radius:7px;
  margin-bottom:12px;
}

.product h3{
  margin:8px 0;
}

.category{
  color:#777;
  font-size:14px;
}

.price{
  color:#0878d1;
  font-size:20px;
  font-weight:bold;
  margin:8px 0;
}

.stock{
  font-size:14px;
  margin-bottom:10px;
}

.add{
  width:100%;
  background:#ff9f00;
  color:white;
  border:0;
  padding:11px;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
}

footer{
  background:#092b50;
  color:white;
  text-align:center;
  padding:25px;
  margin-top:40px;
}

.empty{
  background:white;
  padding:30px;
  text-align:center;
  border-radius:8px;
}

@media(max-width:1000px){
  .product-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .product-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>

<div class="logo">
BEENA TRADING
</div>

<div class="search">
<input
id="search"
type="text"
placeholder="Search products..."
oninput="searchProducts()">
</div>

<div class="header-buttons">

<button class="cart-btn" onclick="openCart()">
🛒 Cart (<span id="cartCount">0</span>)
</button>

<button class="admin-btn" onclick="openAdmin()">
Admin
</button>
<button class="login-btn" onclick="openLogin()">
Login
</button>
</div>

</header>


<nav>

<button onclick="showCategory('All')">
🏠 Home
</button>

<button onclick="showCategory('Electronics')">
📱 Electronics
</button>

<button onclick="showCategory('Fashion')">
👕 Fashion
</button>

<button onclick="showCategory('Home')">
🏠 Home Products
</button>

<button onclick="showCategory('Beauty')">
💄 Beauty
</button>

<button onclick="showCategory('Grocery')">
🛒 Grocery
</button>

<button onclick="showCategory('Accessories')">
🎧 Accessories
</button>

</nav>


<div class="container">

<div class="hero">

<h1>
Welcome to Beena Trading Company
</h1>

<p>
India's New Online Marketplace
</p>

<p>
Shop quality products at great prices.
</p>

<button class="shop-btn"
onclick="document.getElementById('products').scrollIntoView()">
SHOP NOW
</button>

</div>


<h2 id="heading">
Popular Products
</h2>

<div id="products"
class="product-grid">
</div>

</div>


<footer>

© 2026 Beena Trading Company
<br>
India's New Online Marketplace

</footer>


<script>

const defaultProducts = [

{
id:1,
name:"Smartphone",
category:"Electronics",
price:14999,
stock:20,
image:"📱"
},

{
id:2,
name:"Running Shoes",
category:"Fashion",
price:1999,
stock:30,
image:"👟"
},

{
id:3,
name:"Wireless Headphones",
category:"Accessories",
price:1499,
stock:25,
image:"🎧"
},

{
id:4,
name:"Smart Watch",
category:"Electronics",
price:2499,
stock:15,
image:"⌚"
}

];





let products =
JSON.parse(localStorage.getItem("btc_products"))
|| defaultProducts;

products = products.map((p, i) => ({
    ...p,
    id: p.id || i + 1
}));
let cart =
JSON.parse(localStorage.getItem("btc_cart"))
|| [];
function money(number){

return "₹" +
Number(number || 0)
.toLocaleString("en-IN");

}


function saveCart(){

localStorage.setItem(
"btc_cart",
JSON.stringify(cart)
);

}


function updateCartCount(){

let count=0;

cart.forEach(function(item){

count += Number(item.qty || 0);

});

document.getElementById("cartCount")
.textContent=count;

}


function renderProducts(list=products){

let box =
document.getElementById("products");


if(!list.length){

box.innerHTML=
'<div class="empty">No products found.</div>';

return;

}


box.innerHTML = list.map(function(p){

return `

<div class="product" onclick="openProduct(${p.id})">

<div class="product-image">
${p.image || "📦"}
</div>

<h3>${p.name}</h3>

<div class="category">
${p.category}
</div>

<div class="price">
${money(p.price)}
</div>

<div class="stock">
Stock: ${p.stock}
</div>

<button class="add"
onclick="addToCart(${p.id})">
Add to Cart
</button>

</div>

`;

}).join("");

}


function addToCart(id){

let product =
products.find(function(p){

return p.id === id;

});


if(!product){

return;

}


if(Number(product.stock)<=0){

alert("Product is out of stock.");

return;

}


let existing =
cart.find(function(item){

return item.id === id;

});


if(existing){

if(existing.qty >= product.stock){

alert("Maximum available stock reached.");

return;

}

existing.qty++;

}else{

cart.push({
id:id,
qty:1
});

}


saveCart();

updateCartCount();

alert(product.name + " added to cart.");

}
function openProduct(id){
    window.location.href = "product.html?id=" + id;
}

function openCart(){

window.location.href="checkout.html";

}


function openAdmin(){

window.location.href="admin.html";

}
function openLogin(){
    window.location.href="login.html";
}

function showCategory(category){

let list;


if(category==="All"){

list=products;

document.getElementById("heading")
.textContent="Popular Products";

}else{

list=products.filter(function(p){

return p.category === category;

});

document.getElementById("heading")
.textContent=category + " Products";

}


renderProducts(list);

}


function searchProducts(){

let text =
document.getElementById("search")
.value
.toLowerCase()
.trim();


if(!text){

renderProducts(products);

return;

}


let result =
products.filter(function(p){

return (
p.name.toLowerCase().includes(text)
||
p.category.toLowerCase().includes(text)
);

});


renderProducts(result);

}


window.addEventListener(
"storage",
function(event){

if(event.key==="btc_products"){

products =
JSON.parse(event.newValue)
|| [];

renderProducts();

}

});


renderProducts();

updateCartCount();

</script>

</body>
</html>
